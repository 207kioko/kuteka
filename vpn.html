<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVPN - Jakarta Connection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        .vpn-toggle {
            transition: all 0.3s ease;
        }
        .vpn-toggle.on {
            background-color: #4ade80;
        }
        .vpn-toggle.off {
            background-color: #f87171;
        }
        .map-container {
            perspective: 1000px;
        }
        .map-inner {
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }
        .map-container:hover .map-inner {
            transform: rotateY(10deg) rotateX(-5deg);
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg overflow-hidden">
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-lock text-xl"></i>
                    <h1 class="text-xl font-bold">SecureVPN</h1>
                </div>
                <div class="flex items-center space-x-3">
                    <i class="fas fa-bell"></i>
                    <i class="fas fa-cog"></i>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-4">
            <!-- Connection Status -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-6 text-center">
                <div class="flex justify-center mb-4">
                    <div class="relative">
                        <div id="connectionStatus" class="w-32 h-32 rounded-full bg-gray-200 flex items-center justify-center pulse-animation">
                            <i class="fas fa-unlock text-4xl text-red-500"></i>
                        </div>
                        <div class="absolute -bottom-2 -right-2 bg-white p-2 rounded-full shadow-lg">
                            <div id="vpnToggle" class="vpn-toggle off w-12 h-12 rounded-full flex items-center justify-center cursor-pointer">
                                <i class="fas fa-power-off text-white text-xl"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <h2 id="statusText" class="text-xl font-semibold mb-1">Disconnected</h2>
                <p id="locationText" class="text-gray-500">Tap to connect to 197 Lenana Place</p>
            </div>

            <!-- Selected Location -->
            <div class="bg-white rounded-xl shadow-md p-4 mb-6">
                <h3 class="font-semibold text-gray-700 mb-3 flex items-center">
                    <i class="fas fa-map-marker-alt text-indigo-500 mr-2"></i>
                    Selected Location
                </h3>
                <div class="map-container bg-gray-100 rounded-lg overflow-hidden mb-3">
                    <div class="map-inner">
                        <div id="mapPreview" class="h-40 bg-indigo-50 flex items-center justify-center">
                            <i class="fas fa-map-marked-alt text-indigo-300 text-4xl"></i>
                        </div>
                    </div>
                </div>
                <div class="mt-2">
                    <h4 class="font-medium">197Lenana, Nairobi</h4>
                    <p class="text-sm text-gray-500">Lat: -1.2886347, Long: 36.7914314</p>
                    <p class="text-sm text-gray-500 mt-1">Pinned location: <a href="https://maps.app.goo.gl/jfmcyX56w683W4X29" class="text-indigo-500 underline" target="_blank">View on Google Maps</a></p>
                </div>
            </div>

            <!-- Connection Details -->
            <div class="bg-white rounded-xl shadow-md p-4">
                <h3 class="font-semibold text-gray-700 mb-3 flex items-center">
                    <i class="fas fa-info-circle text-indigo-500 mr-2"></i>
                    Connection Details
                </h3>
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">IP Address</span>
                        
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Protocol</span>
                        <span class="font-mono">WireGuard</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Ping</span>
                        <span id="pingValue" class="font-mono">-- ms</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">Data Usage</span>
                        <span class="font-mono">0 MB</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-200 flex justify-around p-3">
            <a href="#" class="text-indigo-600 flex flex-col items-center">
                <i class="fas fa-home"></i>
                <span class="text-xs mt-1">Home</span>
            </a>
            <a href="#" class="text-gray-500 flex flex-col items-center">
                <i class="fas fa-server"></i>
                <span class="text-xs mt-1">Locations</span>
            </a>
            <a href="#" class="text-gray-500 flex flex-col items-center">
                <i class="fas fa-chart-line"></i>
                <span class="text-xs mt-1">Stats</span>
            </a>
            <a href="#" class="text-gray-500 flex flex-col items-center">
                <i class="fas fa-user"></i>
                <span class="text-xs mt-1">Account</span>
            </a>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const vpnToggle = document.getElementById('vpnToggle');
            const connectionStatus = document.getElementById('connectionStatus');
            const statusText = document.getElementById('statusText');
            const locationText = document.getElementById('locationText');
            const ipAddress = document.getElementById('ipAddress');
            const pingValue = document.getElementById('pingValue');
            const mapPreview = document.getElementById('mapPreview');
            
            let isConnected = false;
            
            // Jakarta coordinates from the Google Maps link
            const jakartaLocation = {
                name: "197 Lenana Rd, Nairobi",
                coordinates: "https://www.google.com/maps/place/197+Lenana+Rd,+Nairobi/@-1.2890996,36.7899099,18z/data=!4m6!3m5!1s0x182f10a569e6d761:0xcfd79a8f07b7c6a0!8m2!3d-1.2885969!4d36.7913521!16s%2Fg%2F11ts193h22?entry=ttu&g_ep=EgoyMDI1MDgxMy4wIKXMDSoASAFQAw%3D%3D",
                lat: -1.2886347,
                long: 36.7914314,
                ip: "197.248.100.185" // Example Jakarta IP
            };
            
            // Toggle VPN connection
            vpnToggle.addEventListener('click', function() {
                isConnected = !isConnected;
                
                if (isConnected) {
                    // Connect to Jakarta
                    vpnToggle.classList.remove('off');
                    vpnToggle.classList.add('on');
                    connectionStatus.innerHTML = '<i class="fas fa-lock text-4xl text-green-500"></i>';
                    connectionStatus.classList.remove('bg-gray-200');
                    connectionStatus.classList.add('bg-green-100');
                    statusText.textContent = "Connected";
                    statusText.classList.remove('text-gray-700');
                    statusText.classList.add('text-green-600');
                    locationText.textContent = `Connected to ${jakartaLocation.name}`;
                    ipAddress.textContent = jakartaLocation.ip;
                    
                    // Generate random ping between 30-80ms
                    const randomPing = Math.floor(Math.random() * 50) + 30;
                    pingValue.textContent = `${randomPing} ms`;
                    
                    // Update map preview
                    mapPreview.innerHTML = `
                        <div class="text-center p-2">
                            <i class="fas fa-map-marker-alt text-red-500 text-2xl mb-1"></i>
                            <p class="text-xs font-medium">${jakartaLocation.name}</p>
                            <p class="text-xs text-gray-500">Lat: ${jakartaLocation.lat}, Long: ${jakartaLocation.long}</p>
                        </div>
                    `;
                } else {
                    // Disconnect
                    vpnToggle.classList.remove('on');
                    vpnToggle.classList.add('off');
                    connectionStatus.innerHTML = '<i class="fas fa-unlock text-4xl text-red-500"></i>';
                    connectionStatus.classList.remove('bg-green-100');
                    connectionStatus.classList.add('bg-gray-200');
                    statusText.textContent = "Disconnected";
                    statusText.classList.remove('text-green-600');
                    statusText.classList.add('text-gray-700');
                    locationText.textContent = "Tap to connect to Jakarta";
                    ipAddress.textContent = "192.168.1.1";
                    pingValue.textContent = "-- ms";
                    
                    // Reset map preview
                    mapPreview.innerHTML = '<i class="fas fa-map-marked-alt text-indigo-300 text-4xl"></i>';
                }
            });
            
            // Simulate initial connection check
            setTimeout(() => {
                // This would be where you check actual connection status
                // For demo, we'll assume disconnected initially
            }, 500);
        });
    </script>
</body>
</html>
